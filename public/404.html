<!doctype html>
<html lang="en">
  <head>
    <title>Page Not Found (404)</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-base-200">
    <div class="min-h-screen flex items-center justify-center px-4">
      <div class="text-center">
        <h1 class="text-9xl font-black text-primary mb-4">404</h1>
        <p class="text-4xl font-bold text-base-900 mb-4">Oops! Page not found</p>
        <p class="text-xl text-base-700 mb-8">The page you're looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn btn-primary btn-lg">Go back home</a>
      </div>
    </div>
  </body>
</html>
